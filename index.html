<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1626">
</head>
<body>
<title>Alive Engineering Floor</title>
<meta name="description" content="Premium production-control dashboard for Alive Engineering — live orders, 200+ products with per-machine cycle times, up to 10 machines, worker time study, accounting, monthly reports and 5-year backup, with a phone-first worker app.">


<style>
  /* ============================================================
     ALIVE ENGINEERING — production control
     A precision-instrument look for a CNC shop floor: deep slate
     sidebar, bright crisp workspace, one confident blue accent +
     a steel-violet for machine-time. Sora / Inter / JetBrains Mono.
     Dark theme behind the toggle. Responsive (sidebar → drawer).
     ============================================================ */
  :root{
    --bg:#eef2f7; --surface:#ffffff; --surface-2:#f4f7fb; --surface-3:#eaeef4;
    --line:#e2e8f1; --line-soft:#edf1f6;
    --fg:#101828; --fg-dim:#596579; --fg-faint:#8b97aa;
    --accent:#2f6bff; --accent-dim:#1f55e0; --accent-bg:#e8f0ff; --accent-ink:#ffffff;
    --violet:#6a5cff; --violet-bg:#edeaff;
    --run:#2f6bff; --run-bg:#e8f0ff;
    --done:#0f9d58; --done-bg:#e3f6ec;
    --ready:#d98a00; --ready-bg:#fcf0d9;
    --reject:#e23d3d; --reject-bg:#fdeaea;
    --sidebar:#0d1626; --sidebar-2:#15223a; --sidebar-3:#1c2d49;
    --sidebar-fg:#e7edf6; --sidebar-dim:#8a9cba; --sidebar-faint:#5b6c8a; --sidebar-line:#1f2f4d;
    --radius:14px; --radius-sm:10px; --radius-xs:8px;
    --shadow-sm:0 1px 2px rgba(16,24,40,.05);
    --shadow:0 2px 6px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
    --shadow-lg:0 18px 50px rgba(16,24,40,.18);
    --font-display:"Sora",ui-sans-serif,system-ui,sans-serif;
    --font-body:"Inter",ui-sans-serif,system-ui,sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#0a0f1a; --surface:#111a2b; --surface-2:#0e1626; --surface-3:#172339;
    --line:#223150; --line-soft:#1a2740;
    --fg:#eaf0f8; --fg-dim:#9fb0c9; --fg-faint:#64748f;
    --accent:#4d84ff; --accent-dim:#3a72f0; --accent-bg:rgba(77,132,255,.15); --accent-ink:#0a0f1a;
    --violet:#8b7dff; --violet-bg:rgba(139,125,255,.16);
    --run:#4d84ff; --run-bg:rgba(77,132,255,.15);
    --done:#2bbd73; --done-bg:rgba(43,189,115,.16);
    --ready:#eda32e; --ready-bg:rgba(237,163,46,.16);
    --reject:#ff5d5d; --reject-bg:rgba(255,93,93,.15);
    --sidebar:#070c16; --sidebar-2:#0f1a2c; --sidebar-3:#16233b; --sidebar-line:#18263f;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 2px 8px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4);
    --shadow-lg:0 24px 60px rgba(0,0,0,.6);
    color-scheme:dark;
  }
  *{box-sizing:border-box;} html,body{height:100%;} [hidden]{display:none !important;}
  body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--fg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-.015em;text-wrap:balance;}
  button{font-family:inherit;cursor:pointer;} input,select,textarea{font-family:inherit;}
  a{color:inherit;}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  .eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-faint);}
  ::-webkit-scrollbar{width:10px;height:10px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px;border:3px solid transparent;background-clip:padding-box;}

  /* ===================== LOGIN ===================== */
  #login{position:fixed;inset:0;z-index:50;display:grid;grid-template-columns:1.05fr .95fr;background:var(--bg);}
  #stage-wrap{position:relative;overflow:hidden;background:linear-gradient(160deg,#0d1626,#15223a 60%,#1c2d49);}
  #three-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .stage-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(75% 75% at 50% 45%,#000 40%,transparent 85%);}
  .stage-tag{position:absolute;left:30px;bottom:28px;color:#dbe6f7;}
  .stage-tag .eyebrow{color:#7f93b4;} .stage-tag .big{font-family:var(--font-display);font-size:19px;font-weight:600;margin-top:5px;}
  .stage-badge{position:absolute;top:26px;left:30px;display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;color:#9fe3c6;background:rgba(15,157,88,.14);border:1px solid rgba(15,157,88,.3);padding:5px 11px;border-radius:20px;}
  .stage-badge .liv{width:7px;height:7px;border-radius:50%;background:#2bbd73;box-shadow:0 0 0 0 rgba(43,189,115,.5);animation:pulse 2s infinite;}
  @keyframes pulse{70%{box-shadow:0 0 0 7px rgba(43,189,115,0);}100%{box-shadow:0 0 0 0 rgba(43,189,115,0);}}
  #login-panel{display:flex;flex-direction:column;justify-content:center;gap:26px;padding:48px clamp(30px,6vw,88px);max-width:580px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,var(--accent),#5b86ff);display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(47,107,255,.35);}
  .brand-mark svg{width:23px;height:23px;}
  .brand .name{font-family:var(--font-display);font-weight:700;font-size:16px;line-height:1.1;}
  .brand .by{font-size:11.5px;color:var(--fg-faint);}
  #login-panel h1{font-size:clamp(30px,4.2vw,44px);font-weight:700;line-height:1.05;}
  #login-panel .lead{color:var(--fg-dim);font-size:15px;max-width:44ch;margin-top:12px;}
  .role-pick{display:grid;gap:12px;}
  .role-card{display:flex;align-items:center;gap:15px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:17px 18px;color:var(--fg);transition:border-color .16s,transform .14s,box-shadow .16s;box-shadow:var(--shadow-sm);}
  .role-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow);}
  .role-card .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--accent-bg);color:var(--accent);flex:none;}
  .role-card .ico svg{width:23px;height:23px;}
  .role-card > span:not(.ico):not(.arr){flex:1;min-width:0;}
  .role-card .rt{display:block;font-weight:600;font-family:var(--font-display);font-size:15.5px;}
  .role-card .rd{display:block;font-size:12.5px;color:var(--fg-dim);margin-top:3px;}
  .role-card .arr{margin-left:auto;color:var(--fg-faint);} .role-card:hover .arr{color:var(--accent);transform:translateX(2px);} .role-card .arr{transition:transform .14s;} .role-card .arr svg{width:20px;height:20px;}
  .login-note{font-size:12.5px;color:var(--fg-faint);display:flex;align-items:center;gap:9px;}
  .login-note svg{width:16px;height:16px;flex:none;color:var(--accent);}
  /* login form (credential gate) */
  #loginForm{display:flex;flex-direction:column;gap:15px;max-width:400px;}
  .lf-back{align-self:flex-start;border:none;background:none;color:var(--fg-dim);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:4px 0;} .lf-back:hover{color:var(--accent);} .lf-back svg{width:16px;height:16px;}
  .lf-head{display:flex;align-items:center;gap:13px;}
  .lf-ico{width:46px;height:46px;border-radius:12px;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;flex:none;} .lf-ico svg{width:23px;height:23px;}
  .lf-title{font-family:var(--font-display);font-weight:700;font-size:19px;} .lf-sub{font-size:12.5px;color:var(--fg-dim);margin-top:2px;}
  .lf-field label{display:block;font-size:11px;font-family:var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-dim);margin-bottom:6px;}
  .lf-field input{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:15px;} .lf-field input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);}
  .lf-err{font-size:12.5px;color:var(--reject);background:var(--reject-bg);border:1px solid color-mix(in srgb,var(--reject) 35%,var(--line));border-radius:9px;padding:9px 12px;display:flex;align-items:center;gap:8px;} .lf-err svg{width:15px;height:15px;flex:none;}
  .lf-demo{font-size:12px;color:var(--fg-faint);background:var(--surface-2);border:1px dashed var(--line);border-radius:9px;padding:9px 12px;} .lf-demo b{color:var(--fg-dim);font-family:var(--font-mono);}

  /* ===================== APP SHELL ===================== */
  #app{display:none;min-height:100%;} #app.on{display:block;}
  .layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh;}
  .sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--sidebar);color:var(--sidebar-fg);display:flex;flex-direction:column;border-right:1px solid var(--sidebar-line);z-index:40;}
  .sb-brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px;}
  .sb-brand .brand-mark{width:34px;height:34px;border-radius:9px;}
  .sb-brand .name{font-family:var(--font-display);font-weight:700;font-size:14.5px;color:#fff;line-height:1.1;}
  .sb-brand .by{font-size:10px;color:var(--sidebar-faint);letter-spacing:.02em;}
  .sb-nav{flex:1;padding:6px 12px;display:flex;flex-direction:column;gap:2px;}
  .sb-sec{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#56688a;padding:14px 10px 6px;}
  .sb-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--sidebar-dim);font-size:13px;font-weight:500;border:none;background:none;width:100%;text-align:left;transition:background .13s,color .13s;position:relative;}
  .sb-item svg{width:18px;height:18px;flex:none;}
  .sb-item:hover{background:var(--sidebar-2);color:#dfe8f5;}
  .sb-item.active{background:linear-gradient(90deg,rgba(47,107,255,.22),rgba(47,107,255,.08));color:#fff;}
  .sb-item.active::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);}
  .sb-item .pill{margin-left:auto;background:var(--reject);color:#fff;font-size:10px;font-family:var(--font-mono);border-radius:9px;padding:1px 7px;}
  .sb-foot{padding:12px;border-top:1px solid var(--sidebar-line);}
  .sb-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;}
  .sb-user .av{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--accent),#5b86ff);display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:13px;}
  .sb-user .un{font-size:12.5px;font-weight:600;color:#fff;} .sb-user .ur{font-size:10.5px;color:var(--sidebar-faint);}
  .sb-user .out{margin-left:auto;color:var(--sidebar-dim);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;border:none;background:none;} .sb-user .out:hover{background:var(--sidebar-2);color:#fff;} .sb-user .out svg{width:16px;height:16px;}

  .main{min-width:0;display:flex;flex-direction:column;}
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:13px clamp(16px,2.5vw,30px);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .hamb{display:none;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg-dim);place-items:center;} .hamb svg{width:18px;height:18px;}
  .tb-title h1{font-size:18px;font-weight:600;line-height:1.15;} .tb-title .crumb{font-size:11.5px;color:var(--fg-faint);font-family:var(--font-mono);letter-spacing:.04em;}
  .tb-spacer{flex:1;}
  .tb-search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:230px;max-width:30vw;}
  .tb-search svg{width:15px;height:15px;color:var(--fg-faint);flex:none;} .tb-search input{border:none;background:none;outline:none;flex:1;color:var(--fg);font-size:13px;min-width:0;}
  .ic-btn{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg-dim);display:grid;place-items:center;}
  .ic-btn:hover{color:var(--fg);border-color:var(--accent);} .ic-btn svg{width:18px;height:18px;}
  .bell-badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--reject);color:#fff;font-size:10px;font-family:var(--font-mono);display:grid;place-items:center;border:2px solid var(--surface);}
  #bellWrap{position:relative;}
  .bell-panel{position:absolute;right:0;top:46px;width:320px;max-width:86vw;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;z-index:45;}
  .bell-head{padding:13px 15px;border-bottom:1px solid var(--line-soft);font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center;}
  .bell-list{max-height:360px;overflow-y:auto;}
  .bell-item{display:flex;gap:11px;padding:13px 15px;border-bottom:1px solid var(--line-soft);} .bell-item:last-child{border-bottom:none;} .bell-item.unread{background:var(--accent-bg);}
  .bell-item .bi{width:33px;height:33px;border-radius:9px;background:var(--done-bg);color:var(--done);display:grid;place-items:center;flex:none;} .bell-item .bi svg{width:16px;height:16px;}
  .bell-item .bt{font-size:12.5px;font-weight:600;} .bell-item .bd{font-size:11.5px;color:var(--fg-dim);margin-top:2px;} .bell-item .btime{font-size:10.5px;color:var(--fg-faint);margin-top:4px;font-family:var(--font-mono);}
  .bell-empty{padding:30px;text-align:center;color:var(--fg-faint);font-size:12.5px;}

  .content{padding:clamp(18px,2.5vw,30px) clamp(16px,2.5vw,30px) 70px;}
  .page-intro{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
  .page-intro .pt{font-size:15px;color:var(--fg-dim);}
  .overline{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-faint);margin-bottom:10px;}

  /* buttons */
  .btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 15px;border-radius:10px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:all .13s;box-shadow:var(--shadow-sm);}
  .btn svg{width:15px;height:15px;} .btn:hover{border-color:var(--accent);}
  .btn-accent{background:linear-gradient(145deg,var(--accent),#5b86ff);color:#fff;border:none;box-shadow:0 4px 14px rgba(47,107,255,.28);} .btn-accent:hover{filter:brightness(1.05);}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--fg-dim);box-shadow:none;} .btn-ghost:hover{background:var(--surface-2);color:var(--fg);}
  .btn-sm{padding:7px 12px;font-size:12px;} .btn-block{width:100%;}
  .btn-danger{color:var(--reject);border-color:color-mix(in srgb,var(--reject) 45%,var(--line));background:var(--reject-bg);box-shadow:none;} .btn-danger:hover{border-color:var(--reject);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* cards & grid */
  .grid{display:grid;gap:14px;}
  .cols-4{grid-template-columns:repeat(4,1fr);} .cols-3{grid-template-columns:repeat(3,1fr);} .cols-2{grid-template-columns:repeat(2,1fr);}
  .split{display:grid;gap:14px;grid-template-columns:1.6fr 1fr;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
  .card-pad{padding:16px 18px;}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line-soft);}
  .card-head h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;} .card-head h3 .hi{color:var(--accent);display:grid;place-items:center;} .card-head h3 .hi svg{width:16px;height:16px;}
  .card-head .meta{font-size:11.5px;color:var(--fg-faint);font-family:var(--font-mono);}

  /* KPI stat tile */
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
  .stat .sl{font-size:12px;color:var(--fg-dim);display:flex;align-items:center;gap:7px;}
  .stat .sl .si{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;} .stat .sl .si svg{width:15px;height:15px;}
  .stat .sv{font-family:var(--font-display);font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:10px;line-height:1;}
  .stat .sv .u{font-size:15px;color:var(--fg-faint);font-weight:600;}
  .stat .sf{font-size:11.5px;color:var(--fg-faint);margin-top:5px;display:flex;align-items:center;gap:5px;}
  .delta{font-family:var(--font-mono);font-weight:600;font-size:11px;padding:1px 6px;border-radius:5px;}
  .delta.up{color:var(--done);background:var(--done-bg);} .delta.down{color:var(--reject);background:var(--reject-bg);}
  .stat .spark{position:absolute;right:0;bottom:0;left:0;height:34px;opacity:.9;pointer-events:none;}
  .stat.pad-spark{padding-bottom:30px;}

  /* machine utilisation strip */
  .util-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
  .util{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:13px 14px;}
  .util .uh{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .util .umid{font-family:var(--font-mono);font-weight:700;font-size:13px;}
  .util .ut{font-size:11px;color:var(--fg-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .util .ubar{height:7px;background:var(--surface-3);border-radius:20px;overflow:hidden;margin-top:11px;}
  .util .ubar>i{display:block;height:100%;border-radius:20px;transition:width .6s cubic-bezier(.2,.8,.2,1);}
  .util .uv{font-family:var(--font-mono);font-size:11px;color:var(--fg-dim);margin-top:6px;display:flex;justify-content:space-between;}

  /* status pill */
  .pill{font-size:11px;font-weight:600;font-family:var(--font-mono);padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
  .pill .d{width:6px;height:6px;border-radius:50%;}
  .s-idle{color:var(--fg-dim);background:var(--surface-3);} .s-idle .d{background:var(--fg-faint);}
  .s-run{color:var(--run);background:var(--run-bg);} .s-run .d{background:var(--run);animation:pulse 2s infinite;}
  .s-done{color:var(--done);background:var(--done-bg);} .s-done .d{background:var(--done);}
  .s-ready{color:var(--ready);background:var(--ready-bg);} .s-ready .d{background:var(--ready);}
  .timepill{font-family:var(--font-mono);font-weight:600;font-size:11px;color:var(--violet);background:var(--violet-bg);border-radius:6px;padding:3px 7px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;} .timepill svg{width:11px;height:11px;}

  /* order rows */
  .ord-head,.ord{display:grid;grid-template-columns:62px 1fr 150px 150px 116px;align-items:center;gap:16px;padding:12px 18px;}
  .ord-head{border-bottom:1px solid var(--line-soft);} .ord-head span{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-faint);} .ord-head span.r{text-align:right;}
  .ord{border-bottom:1px solid var(--line-soft);} .ord:last-child{border-bottom:none;} .ord:hover{background:var(--surface-2);}
  .code-chip{font-family:var(--font-mono);font-weight:700;font-size:12.5px;padding:6px 0;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);text-align:center;letter-spacing:.02em;}

function estDur(sec,qty){const t=(sec||0)*qty;const h=Math.floor(t/3600),m=Math.round((t%3600)/60);return h?`${h}h ${m}m`:`${m}m`;}

function acct(){const m={};PARTIES.forEach(p=>m[p.code]={billed:0,received:0,orders:0});BILLS.forEach(b=>{m[b.pcode].billed+=b.qty*b.rate;m[b.pcode].orders++;});PAYMENTS.forEach(p=>{if(m[p.pcode])m[p.pcode].received+=p.amount;});return m;}

/* charts */
function spark(vals,w,h,color){
  const mx=Math.max(...vals),mn=Math.min(...vals),dx=w/(vals.length-1);
  const pts=vals.map((v,i)=>[i*dx,h-((v-mn)/((mx-mn)||1))*(h-4)-2]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" width="100%" height="${h}" style="display:block"><path d="${line} L${w} ${h} L0 ${h} Z" fill="${color}" opacity=".10"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function ring(pct,color,size){const r=size/2-5,c=2*Math.PI*r;return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="5"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-pct/100)).toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;}

function dashboard(){
  const running=JOBS.filter(j=>j.status==="run").length;
  const weekUnits=TREND.reduce((a,b)=>a+b,0);
  const estHrs=JOBS.reduce((s,j)=>s+curSetup(j).estSec*j.qty,0)/3600;
  const made=JOBS.reduce((s,j)=>s+j.setups.reduce((a,x)=>a+x.made,0),0);
  const rej=JOBS.reduce((s,j)=>s+totalRej(j),0);
  const accPct=Math.round((made-rej)/made*100);
  const m=acct(); const revenue=Object.values(m).reduce((s,x)=>s+x.billed,0);
  const outstanding=revenue-Object.values(m).reduce((s,x)=>s+x.received,0);
  const utilAvg=Math.round(Object.values(UTIL).reduce((a,b)=>a+b,0)/MACHINES.filter(x=>x.active).length);
  const stat=(label,icon,ibg,ic2,val,unit,foot,sp,spc)=>`
    <div class="stat ${sp?'pad-spark':''}"><div class="sl"><span class="si" style="background:${ibg};color:${ic2}">${ic[icon]}</span>${label}</div>
      <div class="sv">${val}${unit?`<span class="u"> ${unit}</span>`:''}</div><div class="sf">${foot}</div>
      ${sp?`<div class="spark">${spark(sp,120,34,spc)}</div>`:''}</div>`;
  return `
  <div class="grid cols-4" style="margin-bottom:14px">
    ${stat("Running now","orders","var(--run-bg)","var(--run)",running,"jobs",`<span class="mono">${MACHINES.filter(x=>x.active).length}</span>&nbsp;machines active`)}
    ${stat("Units this week","bolt","var(--violet-bg)","var(--violet)",weekUnits.toLocaleString("en-IN"),"",`<span class="delta up">▲ 14%</span> vs last week`,TREND,"var(--violet)")}
    ${stat("Est. machine time","clock","var(--violet-bg)","var(--violet)",estHrs.toFixed(1),"h",`for running orders`)}
    ${stat("Revenue (Nov)","rupee","var(--done-bg)","var(--done)",inr(revenue),"",`<span class="delta up">▲ ₹3.1k</span> this month`,[4,6,3,8,5,7,9],"var(--done)")}
  </div>
  <div class="split" style="margin-bottom:14px">
    <div class="card">
      <div class="card-head"><h3><span class="hi">${ic.chart}</span>Production — last 7 days</h3><span class="meta">units / day</span></div>
      <div class="card-pad">${spark(TREND,640,120,"var(--accent)")}
        <div style="display:flex;justify-content:space-between;margin-top:8px;font-family:var(--font-mono);font-size:10.5px;color:var(--fg-faint)"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Today</span></div></div>
    </div>
    <div class="card"><div class="card-head"><h3><span class="hi">${ic.check}</span>Quality & load</h3></div>
      <div class="card-pad" style="display:flex;flex-direction:column;gap:16px">
        <div class="ring-wrap"><div class="rc" style="width:66px;height:66px">${ring(accPct,"var(--done)",66)}<div class="rn">${accPct}%</div></div>
          <div><div style="font-weight:600;font-size:13px">Acceptance rate</div><div style="font-size:12px;color:var(--fg-dim)">${made-rej} good of ${made} made · ${rej} reworked</div></div></div>
        <div class="ring-wrap"><div class="rc" style="width:66px;height:66px">${ring(utilAvg,"var(--accent)",66)}<div class="rn">${utilAvg}%</div></div>
          <div><div style="font-weight:600;font-size:13px">Machine utilisation</div><div style="font-size:12px;color:var(--fg-dim)">avg across ${MACHINES.filter(x=>x.active).length} active machines</div></div></div>
      </div></div>
  </div>
  <div class="split">
    <div class="card">
      <div class="card-head"><h3><span class="hi">${ic.cpu}</span>Machine utilisation</h3><button class="btn btn-ghost btn-sm" onclick="go('machines')">View all</button></div>
      <div class="card-pad"><div class="util-strip">
        ${MACHINES.filter(x=>x.active).map(mc=>{const u=UTIL[mc.id]||0;const job=JOBS.find(j=>curSetup(j).machine===mc.id&&j.status==="run");const col=u>75?'var(--done)':u>40?'var(--accent)':u>0?'var(--ready)':'var(--fg-faint)';
          return `<div class="util"><div class="uh"><span class="umid">${mc.id}</span><span class="pill ${job?'s-run':'s-idle'}"><span class="d"></span>${job?'Run':'Idle'}</span></div>
            <div class="ut">${mc.type}</div><div class="ubar"><i style="width:${u}%;background:${col}"></i></div>
            <div class="uv"><span>${job?productOf(job.product).name.split(" ")[0]:'—'}</span><span>${u}%</span></div></div>`;}).join("")}
      </div></div>
    </div>
    <div class="card">
      <div class="card-head"><h3><span class="hi">${ic.check}</span>Recent completions</h3></div>
      <div class="card-pad">
        ${NOTIFS.length?[...NOTIFS].reverse().slice(0,4).map(n=>{const w=workerOf(n.worker);return `<div class="snap"><span class="si" style="color:var(--done);background:var(--done-bg)">${ic.check}</span><div class="sg"><div style="font-weight:600;font-size:12.5px">${w.name} finished ${n.pcode}</div><div class="sm">${productOf(n.product).name} · ${n.made} units · ${n.time}</div></div></div>`;}).join(""):`<div class="empty">No completions yet.</div>`}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
          <button class="btn btn-accent btn-sm" onclick="openJobModal()">${ic.plus}New order</button>

      </div>
    </div>
  </div>`;
}

function ordersPage(){
  const q=prodQuery.trim().toLowerCase();
  let list=JOBS; if(q) list=JOBS.filter(j=>j.pcode.toLowerCase().includes(q)||productOf(j.product).name.toLowerCase().includes(q)||j.product.toLowerCase().includes(q));
  const running=JOBS.filter(j=>j.status==="run").length, completed=JOBS.filter(j=>j.status==="done"||j.status==="closed").length;
  const ready=JOBS.filter(j=>j.status==="done").length, rej=JOBS.reduce((s,j)=>s+totalRej(j),0);
  const miniStat=(l,v,c,s)=>`<div class="stat"><div class="sl"><span class="si" style="background:${c}20;color:${c}"><span style="width:8px;height:8px;border-radius:50%;background:${c}"></span></span>${l}</div><div class="sv">${v}</div><div class="sf">${s}</div></div>`;
  return `
  <div class="page-intro"><div class="pt">Everything on the floor — you see party names &amp; machine time; the floor sees codes.</div>
    <button class="btn btn-accent" onclick="openJobModal()">${ic.plus}New order</button></div>
  <div class="grid cols-4" style="margin-bottom:16px">
    ${miniStat("Running",running,"#2f6bff","jobs on machines")}
    ${miniStat("Completed",completed,"#0f9d58","work finished")}
    ${miniStat("To redo",`<span style='color:var(--reject)'>${rej}</span>`,"#e23d3d","rejected units")}
    ${miniStat("Ready",`<span style='color:var(--ready)'>${ready}</span>`,"#d98a00","tell the party")}
  </div>
  <div class="card"><div class="ord-head"><span>Code</span><span>Product &amp; party</span><span>Machine · time/pc</span><span>Progress</span><span class="r">Status</span></div>
    ${list.length?list.map(ordRow).join(""):`<div class="empty">No orders match "${q}".</div>`}
  </div>`;
}
function ordRow(j){
  const p=partyOf(j.pcode),s=STATUS[j.status],prod=productOf(j.product),cs=curSetup(j);
  const done=j.status==="done"||j.status==="closed",made=cs.made,pct=Math.round(made/j.qty*100),rej=totalRej(j);
  const right=j.status==="done"?`<button class="btn btn-accent btn-sm" onclick="openNotify(${j.id})">${ic.send}Notify</button>`:`<span class="pill ${s.cls}"><span class="d"></span>${s.label}</span>`;
  return `<div class="ord">

function workerCard(j){
  const done=j.status==="done"||j.status==="closed";const s=curSetup(j),pct=Math.round(s.made/j.qty*100);
  let dots="";for(let n=1;n<=MAX_SETUPS;n++){let cls=done?(n<=j.finalAt?"done":"future"):(n<j.cur?"done":n===j.cur?"active":"future");dots+=`<div class="setup-dot ${cls}">${cls==="done"?ic.check:n}</div>`;}
  return `<div class="jobcard ${s.rejected>0&&!done?'is-reject':''}">
    <div class="jc-top"><div><div class="jc-code">${j.pcode}</div><div class="jc-part">${productOf(j.product).name}</div></div><span class="pill ${STATUS[j.status].cls}"><span class="d"></span>${STATUS[j.status].label}</span></div>
    <div class="setups-row"><div class="setups">${dots}</div><div class="setups-label">${done?`Completed at Setup ${j.finalAt}`:`Setup ${j.cur} · ${s.machine}`}</div></div>
    ${done?`<div class="done-banner">${ic.check}Work complete<small>Admin notified — order ${j.pcode} done at Setup ${j.finalAt}</small></div>`
    :`${s.rejected>0?`<div class="reject-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg><div>You rejected <b>${s.rejected} unit(s)</b> on this setup.${s.reason?` <span class="why">(${s.reason})</span>`:''}</div></div>`:""}
      <div class="est-row"><div><div class="el">Est. time / unit on <b>${s.machine}</b></div><div class="es">Order of ${j.qty} pcs ≈ ${estDur(s.estSec,j.qty)}</div></div><button class="tap-time" onclick="openEst(${j.id})">${ic.clock}${fmtMS(s.estSec)}</button></div>
      <div class="jc-big"><div class="num">${s.made}<span class="of"> / ${j.qty}</span></div><div class="lbl">units made · Setup ${j.cur}</div><div class="jc-bar ${pct>=100?'full':''}"><i style="width:${pct}%"></i></div></div>
      ${j.status==="idle"?`<button class="btn btn-accent btn-block" style="margin-top:16px" onclick="startJob(${j.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>Start this job</button>`
      :`<div class="stepper"><button onclick="bump(${j.id},-1)">−</button><div class="val"><b id="val-${j.id}">${s.made}</b><span>made this setup</span></div><button onclick="bump(${j.id},1)">+</button></div>
        <div class="reject-row"><span>Rejected this setup: <b>${s.rejected}</b></span><button class="btn btn-sm btn-danger" onclick="openReject(${j.id})">${ic.x}Reject units</button></div>
        <div class="setup-actions ${j.cur<MAX_SETUPS?'two':''}">${j.cur<MAX_SETUPS?`<button class="btn" onclick="nextSetup(${j.id})">Next setup <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>`:""}
          <button class="btn btn-accent" onclick="openFinal(${j.id})">${ic.check}Final setup — done</button></div>`}`}
  </div>`;
}
function bump(id,d){const j=JOBS.find(x=>x.id===id);if(!j)return;const s=curSetup(j);s.made=Math.max(0,Math.min(j.qty,s.made+d));if(j.status==="idle"&&s.made>0)j.status="run";const el=document.getElementById("val-"+id);if(el)el.textContent=s.made;const bar=el?.closest(".jobcard")?.querySelector(".jc-bar");const i=bar?.querySelector("i");if(i){const pct=Math.round(s.made/j.qty*100);i.style.width=pct+"%";bar.classList.toggle("full",pct>=100);}}
function startJob(id){const j=JOBS.find(x=>x.id===id);if(j){j.status="run";render();toast("Job started","Admin can now see "+j.pcode+" is in progress");}}
function nextSetup(id){const j=JOBS.find(x=>x.id===id);if(!j||j.cur>=MAX_SETUPS)return;j.cur++;if(!j.setups[j.cur-1]){const mc=workerOf(j.worker).machine;j.setups.push({machine:mc,made:0,rejected:0,reason:"",estSec:productOf(j.product).est[mc]||0});}render();toast("Moved to Setup "+j.cur,j.pcode+" is now on Setup "+j.cur);}

/* worker: est time */
let estM=0,estS=0,curEstJob=null;
function openEst(id){curEstJob=JOBS.find(x=>x.id===id);const j=curEstJob,s=curSetup(j);estM=Math.floor(s.estSec/60);estS=s.estSec%60;
  scrim(`<div class="modal"><div class="modal-head"><div class="mi violet">${ic.clock}</div><div><h3>Estimated time per unit</h3><p>${j.pcode} — ${productOf(j.product).name} · ${s.machine}</p></div></div>
    <div class="modal-body"><div class="field"><label>Time printed / estimated on the machine (per piece)</label>
      <div class="time-input"><div class="ti"><div class="mini-step"><button onclick="estStep('m',-1)">−</button><div class="v" id="estM">${pad2(estM)}</div><button onclick="estStep('m',1)">+</button></div></div><span class="sep">min</span>
        <div class="ti"><div class="mini-step"><button onclick="estStep('s',-5)">−</button><div class="v" id="estS">${pad2(estS)}</div><button onclick="estStep('s',5)">+</button></div></div><span class="sep">sec</span></div>
      <div class="hint">Order of ${j.qty} pcs ≈ <b id="estTot">${estDur(estM*60+estS,j.qty)}</b> of machine time. Saved to this product &amp; machine.</div></div></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeScrim(this)">Cancel</button><button class="btn btn-accent" onclick="saveEst(${id},this)">Save time</button></div></div>`);}
function estStep(f,d){if(f==="m")estM=Math.max(0,Math.min(59,estM+d));else{estS+=d;if(estS>55){estS=0;estM=Math.min(59,estM+1);}if(estS<0){estS=55;estM=Math.max(0,estM-1);}}document.getElementById("estM").textContent=pad2(estM);document.getElementById("estS").textContent=pad2(estS);if(curEstJob)document.getElementById("estTot").textContent=estDur(estM*60+estS,curEstJob.qty);}
function saveEst(id,btn){const j=JOBS.find(x=>x.id===id),s=curSetup(j);s.estSec=estM*60+estS;productOf(j.product).est[s.machine]=s.estSec;closeScrim(btn);render();toast("Time saved",`${s.machine}: ${fmtMS(s.estSec)}/pc for ${productOf(j.product).name}`);}

/* worker: reject */
let rejQty=1;
function openReject(id){const j=JOBS.find(x=>x.id===id);rejQty=1;
  scrim(`<div class="modal"><div class="modal-head"><div class="mi danger">${ic.x}</div><div><h3>Reject units</h3><p>${j.pcode} — ${productOf(j.product).name} · ${curSetup(j).machine} · Setup ${j.cur}</p></div></div>
    <div class="modal-body"><div class="field"><label>How many units to reject</label><div class="mini-step"><button onclick="rejStep(-1)">−</button><div class="v" id="rejv">1</div><button onclick="rejStep(1)">+</button></div></div>
      <div class="field"><label>Reason note (optional)</label><textarea id="rej-reason" placeholder="e.g. burr on face, bore undersize, wrong dimension…"></textarea><div class="hint">Admin sees this on the Rework screen.</div></div></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeScrim(this)">Cancel</button><button class="btn btn-danger" onclick="confirmReject(${id},this)">${ic.x}Reject <span id="rejlbl">1</span></button></div></div>`);}
function rejStep(d){rejQty=Math.max(1,rejQty+d);document.getElementById("rejv").textContent=rejQty;document.getElementById("rejlbl").textContent=rejQty;}
function confirmReject(id,btn){const j=JOBS.find(x=>x.id===id),s=curSetup(j),reason=(document.getElementById("rej-reason").value||"").trim();s.rejected+=rejQty;if(reason)s.reason=reason;closeScrim(btn);render();toastRej(rejQty+" unit(s) rejected",j.pcode+" "+s.machine+(reason?` — "${reason}"`:""));}

/* worker: final */
function openFinal(id){const j=JOBS.find(x=>x.id===id),s=curSetup(j);
  scrim(`<div class="modal"><div class="modal-head"><div class="mi">${ic.check}</div><div><h3>Mark work complete?</h3><p>This tells the admin the part is finished.</p></div></div>
    <div class="modal-body"><div class="send-to"><div><div style="font-weight:600">${j.pcode} — ${productOf(j.product).name}</div><div class="ord-sub">Finishing at <b style="color:var(--fg)">Setup ${j.cur}</b> · ${s.machine} · ${s.made} units</div></div><span class="code-chip" style="padding:6px 12px">${j.pcode}</span></div>
      <div class="field hint" style="margin:0">Press this on whichever setup finishes the part — not every unit needs all ${MAX_SETUPS} setups.</div></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeScrim(this)">Not yet</button><button class="btn btn-accent" onclick="confirmFinal(${id},this)">${ic.check}Yes, work is complete</button></div></div>`);}
function confirmFinal(id,btn){const j=JOBS.find(x=>x.id===id),s=curSetup(j);j.status="done";j.finalAt=j.cur;const now=new Date();NOTIFS.push({id:Date.now(),worker:j.worker,pcode:j.pcode,product:j.product,setup:j.cur,made:s.made,time:"Today "+now.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:false}),read:false});closeScrim(btn);render();toast("Sent to admin","Work on "+j.pcode+" complete at Setup "+j.cur+" — admin notified");}

/* ============================================================ ADMIN MODALS ============================================================ */
function scrim(html){const d=document.createElement("div");d.className="scrim";d.innerHTML=html;d.addEventListener("click",e=>{if(e.target===d)d.remove();});document.body.appendChild(d);return d;}
function closeScrim(el){(el.closest?el.closest(".scrim"):el).remove();}
function openJobModal(){
  scrim(`<div class="modal"><div class="modal-head"><div class="mi">${ic.plus}</div><div><h3>New order</h3><p>Pick a product &amp; party, set quantity, assign a worker / machine.</p></div></div>
    <div class="modal-body"><div class="field"><label>Product</label><select id="f-prod">${PRODUCTS.map(p=>`<option value="${p.code}">${p.code} — ${p.name}</option>`).join("")}</select><div class="hint">200+ products; cycle time &amp; rate come from the product.</div></div>
      <div class="field"><label>Party</label><select id="f-party">${PARTIES.map(p=>`<option value="${p.code}">${p.code} — ${p.name}</option>`).join("")}</select><div class="hint">The worker will only see the code.</div></div>
      <div class="row"><div class="field"><label>Quantity</label><input id="f-qty" type="number" value="100"></div><div class="field"><label>Worker / machine</label><select id="f-worker">${WORKERS.map(w=>`<option value="${w.id}">${w.name} — ${w.machine}</option>`).join("")}</select></div></div></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeScrim(this)">Cancel</button><button class="btn btn-accent" onclick="addJob(this)">Add order</button></div></div>`);}
function addJob(btn){const code=document.getElementById("f-prod").value,pcode=document.getElementById("f-party").value,qty=parseInt(document.getElementById("f-qty").value)||50,worker=document.getElementById("f-worker").value||"raju01",mc=workerOf(worker).machine,est=productOf(code).est[mc]||0;JOBS.unshift({id:Date.now(),product:code,pcode,qty,worker,status:"idle",cur:1,finalAt:null,setups:[{machine:mc,made:0,rejected:0,reason:"",estSec:est}]});closeScrim(btn);adminTab="orders";render();toast("Order added",pcode+" · "+productOf(code).name+" on "+mc);}
function openProductModal(){
  scrim(`<div class="modal"><div class="modal-head"><div class="mi">${ic.box}</div><div><h3>Add product</h3><p>Add to your catalogue with rate and per-machine time.</p></div></div>
    <div class="modal-body"><div class="row"><div class="field"><label>Code</label><input id="p-code" placeholder="BKT-55" class="mono"></div><div class="field"><label>Material</label><input id="p-mat" placeholder="SS304"></div></div>
      <div class="field"><label>Product name</label><input id="p-name" placeholder="Bracket BKT-55"></div>
      <div class="row"><div class="field"><label>Rate (₹ / pc)</label><input id="p-rate" type="number" value="50"></div><div class="field"><label>Est. time on M-1 (mm:ss)</label><input id="p-est" placeholder="01:30" class="mono"></div></div></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeScrim(this)">Cancel</button><button class="btn btn-accent" onclick="addProduct(this)">Save product</button></div></div>`);}
function addProduct(btn){const code=(document.getElementById("p-code").value||"NEW-00").toUpperCase(),name=document.getElementById("p-name").value||"New product",mat=document.getElementById("p-mat").value||"MS",rate=parseInt(document.getElementById("p-rate").value)||0,t=(document.getElementById("p-est").value||"").split(":"),est={};if(t.length===2){const sec=(parseInt(t[0])||0)*60+(parseInt(t[1])||0);if(sec)est["M-1"]=sec;}PRODUCTS.unshift({code,name,mat,rate,est});closeScrim(btn);renderContent();toast("Product added",name+" added to catalogue");}
function openPartyModal(){
  scrim(`<div class="modal"><div class="modal-head"><div class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><div><h3>Add party</h3><p>The code goes to the floor. The name stays with you.</p></div></div>
    <div class="modal-body"><div class="field"><label>Party name</label><input placeholder="Shah Metal Works"></div><div class="row"><div class="field"><label>Code</label><input placeholder="P-21" class="mono"></div><div class="field"><label>Contact</label><input placeholder="+91 ..." class="mono"></div></div></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeScrim(this)">Cancel</button><button class="btn btn-accent" onclick="closeScrim(this);toast('Party added','Saved — only the code goes to the floor')">Save</button></div></div>`);}
function openWorkerModal(){
  scrim(`<div class="modal"><div class="modal-head"><div class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></div><div><h3>Add worker</h3><p>You set the login and machine.</p></div></div>
    <div class="modal-body"><div class="field"><label>Name</label><input placeholder="Mahesh Solanki"></div><div class="row"><div class="field"><label>Login ID</label><input placeholder="mahesh05" class="mono"></div><div class="field"><label>PIN</label><input placeholder="4 digits" class="mono"></div></div>
      <div class="field"><label>Machine</label><select>${MACHINES.map(m=>`<option>${m.id} — ${m.name}</option>`).join("")}</select></div></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeScrim(this)">Cancel</button><button class="btn btn-accent" onclick="closeScrim(this);toast('Worker added','Login created — share the ID &amp; PIN')">Create login</button></div></div>`);}
function openPaymentModal(){
  scrim(`<div class="modal"><div class="modal-head"><div class="mi">${ic.rupee}</div><div><h3>Record payment</h3><p>Mark money received against a party.</p></div></div>
    <div class="modal-body"><div class="field"><label>Party</label><select id="pay-party">${PARTIES.map(p=>`<option value="${p.code}">${p.code} — ${p.name}</option>`).join("")}</select></div>
      <div class="row"><div class="field"><label>Amount (₹)</label><input id="pay-amt" type="number" value="5000"></div><div class="field"><label>Reference</label><input id="pay-ref" placeholder="UPI / NEFT ref" class="mono"></div></div></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeScrim(this)">Cancel</button><button class="btn btn-accent" onclick="addPayment(this)">Save payment</button></div></div>`);}
function addPayment(btn){const pcode=document.getElementById("pay-party").value,amt=parseInt(document.getElementById("pay-amt").value)||0,ref=document.getElementById("pay-ref").value||"—",now=new Date(),date=now.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});PAYMENTS.push({pcode,amount:amt,date,ref});closeScrim(btn);renderContent();toast("Payment recorded",inr(amt)+" received from "+partyOf(pcode).name);}
function openNotify(id){const j=JOBS.find(x=>x.id===id),p=partyOf(j.pcode);
  scrim(`<div class="modal"><div class="modal-head"><div class="mi">${ic.send}</div><div><h3>Order ready — notify party</h3><p>${productOf(j.product).name} is finished at Setup ${j.finalAt}.</p></div></div>
    <div class="modal-body"><div class="field"><label>Sending to</label><div class="send-to"><div><div style="font-weight:600">${p.name}</div><div class="mono" style="font-size:12px;color:var(--fg-dim)">${p.phone}</div></div><span class="code-chip" style="padding:6px 12px">${j.pcode}</span></div></div>
      <div class="field"><label>Message (SMS via your DLT sender)</label><div class="msg-preview"><div class="wa">${ic.send}SMS · Alive Engineering</div>Namaste ${p.name.split(" ")[0]} ji, your order <b>${j.pcode} — ${productOf(j.product).name}</b> is ready. You can collect your parts. — Alive Engineering</div></div></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeScrim(this)">Cancel</button><button class="btn btn-accent" onclick="sendNotify(${id},this)">${ic.send}Send</button></div></div>`);}
function sendNotify(id,btn){const j=JOBS.find(x=>x.id===id);j.status="closed";closeScrim(btn);render();toast("Party notified",partyOf(j.pcode).name+" told their order is ready");}

/* bell / toast / theme */
function renderBell(){const unread=NOTIFS.filter(n=>!n.read).length,badge=document.getElementById("bellBadge");if(!badge)return;badge.hidden=unread===0;badge.textContent=unread;
  document.getElementById("bellPanel").innerHTML=`<div class="bell-head"><span>Completion alerts</span><span class="eyebrow">${NOTIFS.length} total</span></div><div class="bell-list">${NOTIFS.length?[...NOTIFS].reverse().map(n=>{const w=workerOf(n.worker);return `<div class="bell-item ${n.read?'':'unread'}"><div class="bi">${ic.check}</div><div><div class="bt">${w.name} finished ${n.pcode}</div><div class="bd">${productOf(n.product).name} · Setup ${n.setup} · ${n.made} units</div><div class="btime">${n.time}</div></div></div>`;}).join(""):`<div class="bell-empty">No completion alerts yet.</div>`}</div>`;}
function toggleBell(e){if(e)e.stopPropagation();const panel=document.getElementById("bellPanel");const show=panel.hidden;panel.hidden=!show;if(show){NOTIFS.forEach(n=>n.read=true);renderBell();panel.hidden=false;}}
document.addEventListener("click",e=>{const wrap=document.getElementById("bellWrap");if(wrap&&!wrap.contains(e.target)){const p=document.getElementById("bellPanel");if(p)p.hidden=true;}});
function toast(title,desc){_toast(title,desc,false);}
function toastRej(title,desc){_toast(title,desc,true);}
function _toast(title,desc,rej){const t=document.createElement("div");t.className="toast"+(rej?" rej":"");const svg=rej?'<path d="M18 6 6 18M6 6l12 12"/>':'<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/>';t.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${svg}</svg><div><div class="tt">${title}</div><div class="td">${desc}</div></div>`;document.getElementById("toasts").appendChild(t);setTimeout(()=>{t.style.transition="opacity .4s,transform .4s";t.style.opacity="0";t.style.transform="translateX(16px)";setTimeout(()=>t.remove(),400);},3600);}
function toggleTheme(){const cur=document.documentElement.getAttribute("data-theme")||"light",next=cur==="light"?"dark":"light";document.documentElement.setAttribute("data-theme",next);const el=document.getElementById("themeIcon");if(el){if(next==="dark")el.innerHTML='<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>';else el.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>';}if(window.__relitShop)window.__relitShop(next);}
document.documentElement.setAttribute("data-theme","light");

/* boot — prototype opens straight into the owner console (no login) */
openApp("admin");

</script>
